name: Build and deploy blog

on:
  workflow_call:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed, deleted]
  schedule:
    # Refresh article metadata every Monday at 00:00 (Asia/Shanghai).
    - cron: "0 16 * * 0"

concurrency:
  group: gmeek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write
      issues: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Check configuration
        run: |
          jq empty config.json
          jq . config.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Clone source code
        run: |
          GMEEK_VERSION=$(jq -r ".GMEEK_VERSION" config.json)
          git clone https://github.com/Meekdai/Gmeek.git "${RUNNER_TEMP}/Gmeek"
          cd "${RUNNER_TEMP}/Gmeek"
          last_tag=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          if [ "${GMEEK_VERSION}" = "last" ]; then
            git checkout "${last_tag}"
          else
            git checkout "${GMEEK_VERSION}"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${RUNNER_TEMP}/Gmeek/requirements.txt"

      - name: Generate site
        run: |
          cp -R ./* "${RUNNER_TEMP}/Gmeek/"
          cd "${RUNNER_TEMP}/Gmeek"
          # Gmeek v2.22 requires an explicit empty issue number for a full rebuild.
          python Gmeek.py "${{ github.token }}" "${{ github.repository }}" --issue_number ''
          cp -a "${RUNNER_TEMP}/Gmeek/docs" "${GITHUB_WORKSPACE}"
          cp -a "${RUNNER_TEMP}/Gmeek/backup" "${GITHUB_WORKSPACE}"
          cp "${RUNNER_TEMP}/Gmeek/blogBase.json" "${GITHUB_WORKSPACE}"

      - name: Commit generated site
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md blogBase.json backup docs
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: rebuild blog"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/.'

  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
